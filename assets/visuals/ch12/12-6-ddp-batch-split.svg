<svg xmlns="http://www.w3.org/2000/svg" width="900" height="285" viewBox="0 0 900 285">
  <rect width="900" height="285" fill="#ffffff"/>
  <text x="30" y="38" font-size="24" font-family="sans-serif" fill="#111827">例：全局 batch=10，3 个进程</text>
  <rect x="45" y="75" width="230" height="70" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="70" y="108" font-size="18" font-family="sans-serif">rank 0：4 个样本</text><text x="70" y="133" font-size="15" font-family="sans-serif">权重 4/10</text>
  <rect x="335" y="75" width="230" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/><text x="360" y="108" font-size="18" font-family="sans-serif">rank 1：3 个样本</text><text x="360" y="133" font-size="15" font-family="sans-serif">权重 3/10</text>
  <rect x="625" y="75" width="230" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="650" y="108" font-size="18" font-family="sans-serif">rank 2：3 个样本</text><text x="650" y="133" font-size="15" font-family="sans-serif">权重 3/10</text>
  <text x="385" y="190" font-size="28" font-family="sans-serif">↓ all-reduce</text>
  <rect x="250" y="215" width="400" height="45" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/><text x="295" y="244" font-size="18" font-family="sans-serif">全局梯度 = 0.4g₀ + 0.3g₁ + 0.3g₂</text>
  <text x="35" y="278" font-size="15" font-family="sans-serif" fill="#4b5563">DistributedSampler 负责数据不重叠；DDP 负责反向时同步梯度。</text>
</svg>
