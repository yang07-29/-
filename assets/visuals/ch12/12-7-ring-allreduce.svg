<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="30" y="38" font-size="24" font-family="sans-serif" fill="#111827">例：4 个工作器，每个梯度 8 个数 → 切成 4 块，每块 2 个数</text>
  <circle cx="450" cy="88" r="45" fill="#dbeafe" stroke="#3b82f6"/><text x="430" y="95" font-size="18" font-family="sans-serif">W0</text>
  <circle cx="650" cy="180" r="45" fill="#ecfdf5" stroke="#10b981"/><text x="630" y="187" font-size="18" font-family="sans-serif">W1</text>
  <circle cx="450" cy="245" r="45" fill="#fef3c7" stroke="#f59e0b"/><text x="430" y="252" font-size="18" font-family="sans-serif">W2</text>
  <circle cx="250" cy="180" r="45" fill="#fce7f3" stroke="#ec4899"/><text x="230" y="187" font-size="18" font-family="sans-serif">W3</text>
  <text x="525" y="125" font-size="25" font-family="sans-serif">↘</text><text x="555" y="232" font-size="25" font-family="sans-serif">↙</text><text x="330" y="232" font-size="25" font-family="sans-serif">↖</text><text x="330" y="125" font-size="25" font-family="sans-serif">↗</text>
  <text x="35" y="100" font-size="17" font-family="sans-serif">阶段 1：边传边加</text><text x="35" y="130" font-size="17" font-family="sans-serif">reduce-scatter</text>
  <text x="690" y="100" font-size="17" font-family="sans-serif">阶段 2：传播完整块</text><text x="690" y="130" font-size="17" font-family="sans-serif">all-gather</text>
  <text x="35" y="285" font-size="16" font-family="sans-serif" fill="#4b5563">最终每个工作器都得到相同的 8 维梯度和；除以 4 后即平均梯度。</text>
</svg>
