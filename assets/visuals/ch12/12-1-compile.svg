<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <rect width="900" height="250" fill="#ffffff"/>
  <text x="30" y="38" font-size="24" font-family="sans-serif" fill="#111827">例：f(x)=ReLU(2x+1)，x=[-1, 2]</text>
  <rect x="35" y="75" width="190" height="90" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="55" y="110" font-size="18" font-family="sans-serif">Eager：逐句派发</text><text x="55" y="140" font-size="16" font-family="sans-serif">乘 → 加 → ReLU</text>
  <text x="245" y="128" font-size="28" font-family="sans-serif">→</text>
  <rect x="285" y="75" width="260" height="90" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="305" y="110" font-size="18" font-family="sans-serif">Compile：先看完整子图</text><text x="305" y="140" font-size="16" font-family="sans-serif">再生成/选择执行方案</text>
  <text x="565" y="128" font-size="28" font-family="sans-serif">→</text>
  <rect x="605" y="75" width="250" height="90" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="625" y="110" font-size="18" font-family="sans-serif">两者正确输出相同</text><text x="625" y="140" font-size="20" font-family="monospace">[0, 5]</text>
  <text x="35" y="210" font-size="16" font-family="sans-serif" fill="#4b5563">首轮编译有成本；重复执行同形状输入时才可能摊薄。</text>
</svg>
