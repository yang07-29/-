<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">BERT 三种下游头的 Shape</title><desc id="desc">二乘五乘八的编码分别变成分类二乘三、标注二乘五乘四和问答两个二乘五。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">15.6 骨干相同，任务头决定输出粒度</text>
  <rect x="40" y="130" width="220" height="100" rx="14" fill="#fef3c7"/><text x="65" y="171" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#92400e">BERT encoded</text><text x="92" y="207" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">(2,5,8)</text>
  <rect x="350" y="65" width="220" height="75" rx="13" fill="#e0f2fe"/><text x="372" y="96" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#075985">取 &lt;cls&gt; → 分类</text><text x="430" y="124" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">(2,3)</text>
  <rect x="350" y="155" width="220" height="75" rx="13" fill="#ede9fe"/><text x="372" y="186" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#5b21b6">每位置 → 标注</text><text x="416" y="214" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">(2,5,4)</text>
  <rect x="350" y="245" width="220" height="75" rx="13" fill="#dcfce7"/><text x="372" y="276" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#166534">每位置 → 问答</text><text x="398" y="304" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">2 × (2,5)</text>
  <path d="M260 180C310 180 305 102 342 102M260 180H342M260 180C310 180 305 282 342 282" fill="none" stroke="#64748b" stroke-width="3"/>
  <text x="630" y="111" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#334155">每序列 1 个标签</text><text x="630" y="201" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#334155">每词元 1 个标签</text><text x="630" y="291" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#334155">每词元 2 个跨度分数</text>
</svg>
