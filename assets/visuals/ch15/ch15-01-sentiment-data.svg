<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">三条变长评论补齐</title><desc id="desc">三条长度二三一的评论补齐到长度三，并保留有效长度和标签。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">15.1 Shape 相同，不代表真实长度相同</text>
  <text x="45" y="102" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#075985">评论</text><text x="205" y="102" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#5b21b6">补齐到 S=3</text><text x="590" y="102" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#166534">有效长度 / 标签</text>
  <rect x="40" y="125" width="760" height="48" rx="10" fill="#e0f2fe"/><text x="60" y="156" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">good movie</text><text x="205" y="156" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">[good, movie,</text><text x="365" y="156" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8">pad]</text><text x="620" y="156" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">2 / 1</text>
  <rect x="40" y="185" width="760" height="48" rx="10" fill="#ede9fe"/><text x="60" y="216" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">very bad ending</text><text x="205" y="216" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">[very, bad, ending]</text><text x="620" y="216" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">3 / 0</text>
  <rect x="40" y="245" width="760" height="48" rx="10" fill="#dcfce7"/><text x="60" y="276" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">great</text><text x="205" y="276" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">[great,</text><text x="280" y="276" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8">pad, pad]</text><text x="620" y="276" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">1 / 1</text>
  <text x="820" y="169" font-family="Arial,sans-serif" font-size="16" fill="#334155">tokens</text><text x="820" y="195" font-family="Arial,sans-serif" font-size="16" fill="#334155">(3,3)</text>
</svg>
