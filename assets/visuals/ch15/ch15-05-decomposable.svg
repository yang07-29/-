<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">软对齐的手算例子</title><desc id="desc">dog 对 animal 和 sleeps 的分数二与零，softmax 权重约零点八八一和零点一一九。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">15.5 软对齐不是二选一，而是加权平均</text>
  <rect x="45" y="100" width="210" height="170" rx="14" fill="#e0f2fe"/><text x="65" y="136" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">匹配分数</text><text x="65" y="181" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">dog→animal: 2</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">dog→sleeps: 0</text>
  <rect x="355" y="100" width="210" height="170" rx="14" fill="#ede9fe"/><text x="375" y="136" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">行 softmax</text><text x="385" y="181" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">[0.881, 0.119]</text><text x="385" y="220" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">两权重之和 = 1</text>
  <rect x="665" y="82" width="210" height="206" rx="14" fill="#dcfce7"/><text x="685" y="120" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">对齐向量 β</text><text x="688" y="166" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">0.881·animal</text><text x="688" y="199" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">+ 0.119·sleeps</text><text x="688" y="247" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#334155">主要对齐 animal</text>
  <path d="M255 185H347M565 185H657" stroke="#64748b" stroke-width="3"/><path d="M340 177l10 8-10 8M650 177l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
