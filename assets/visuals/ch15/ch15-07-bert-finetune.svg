<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">BERT 分层学习率</title><desc id="desc">相同单位梯度下，编码器用零点零零一小步更新，新分类头用零点零一大步更新。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">15.7 新头快学，预训练骨干慢改</text>
  <rect x="50" y="91" width="250" height="205" rx="14" fill="#e0f2fe"/><text x="73" y="129" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">预训练 Encoder</text><text x="80" y="177" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">gradient norm = 1</text><text x="80" y="217" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">lr = 0.001</text><text x="80" y="260" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#075985">步长约 0.001</text>
  <rect x="365" y="91" width="190" height="205" rx="14" fill="#fef3c7"/><text x="405" y="129" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#92400e">共同损失</text><text x="405" y="180" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">NLI CE</text><text x="392" y="220" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">一次 backward</text>
  <rect x="620" y="91" width="250" height="205" rx="14" fill="#dcfce7"/><text x="665" y="129" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">新分类头</text><text x="650" y="177" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">gradient norm = 1</text><text x="650" y="217" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">lr = 0.01</text><text x="650" y="260" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#166534">步长约 0.01</text>
  <path d="M357 193H308M563 193H612" stroke="#64748b" stroke-width="3"/><path d="M315 185l-10 8 10 8M605 185l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
