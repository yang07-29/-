<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">同一前提的三种 NLI 关系</title><desc id="desc">黑狗在公园跑分别对应可推出、明确冲突和信息不足三种假设。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">15.4 中性是“信息不足”，不是“反面”</text>
  <rect x="205" y="78" width="510" height="62" rx="13" fill="#fef3c7"/><text x="273" y="117" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#92400e">前提：一只黑狗在公园跑</text>
  <rect x="35" y="210" width="260" height="105" rx="14" fill="#dcfce7"/><text x="55" y="245" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">一只狗在跑</text><text x="55" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#166534">蕴涵：可推出</text>
  <rect x="330" y="210" width="260" height="105" rx="14" fill="#fee2e2"/><text x="350" y="245" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">没有狗在跑</text><text x="350" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#991b1b">矛盾：明确冲突</text>
  <rect x="625" y="210" width="260" height="105" rx="14" fill="#e0f2fe"/><text x="645" y="245" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">这只狗饿了</text><text x="645" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" font-weight="700" fill="#075985">中性：没有信息</text>
  <path d="M460 140C460 175 165 168 165 202M460 140V202M460 140C460 175 755 168 755 202" fill="none" stroke="#64748b" stroke-width="2.5"/>
</svg>
