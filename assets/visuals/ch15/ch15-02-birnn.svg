<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">双向 LSTM 状态连接</title><desc id="desc">批量二隐藏三的双向最终状态从二乘二乘三连接为二乘六，再分类为二乘二。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">15.2 双向让特征宽度翻倍</text>
  <rect x="45" y="95" width="220" height="190" rx="14" fill="#e0f2fe"/><text x="65" y="130" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">h_n (2,2,3)</text><rect x="74" y="153" width="160" height="42" rx="8" fill="#38bdf8"/><rect x="74" y="210" width="160" height="42" rx="8" fill="#7dd3fc"/><text x="102" y="180" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#082f49">正向 (2,3)</text><text x="102" y="237" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#082f49">反向 (2,3)</text>
  <rect x="350" y="95" width="220" height="190" rx="14" fill="#ede9fe"/><text x="370" y="130" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">沿特征维连接</text><text x="385" y="191" font-family="Arial,sans-serif" font-size="22" fill="#0f172a">(2,3)+(2,3)</text><text x="420" y="235" font-family="Arial,sans-serif" font-size="22" fill="#5b21b6">→ (2,6)</text>
  <rect x="655" y="95" width="220" height="190" rx="14" fill="#dcfce7"/><text x="675" y="130" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">分类头</text><text x="700" y="187" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">W: (2,6)</text><text x="700" y="230" font-family="Arial,sans-serif" font-size="20" fill="#166534">logits: (2,2)</text>
  <path d="M265 190H342M570 190H647" stroke="#64748b" stroke-width="3"/><path d="M335 182l10 8-10 8M640 182l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
