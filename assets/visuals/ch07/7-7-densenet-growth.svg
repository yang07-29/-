<svg xmlns="http://www.w3.org/2000/svg" width="960" height="265" viewBox="0 0 960 265" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">DenseNet增长率通道手算</title><desc id="d">输入六通道，三层每层新增四通道，依次增长为十十四十八通道。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:10}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:10}.a{stroke:#64748b;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">输入 C₀=6，三层增长率 k=4：每层只新增 4 个通道</text><rect x="35" y="92" width="150" height="82" class="b"/><text x="61" y="126" class="x">输入 6 通道</text><text x="61" y="154" class="s">H、W 不变</text><line x1="185" y1="133" x2="225" y2="133" class="a"/><rect x="233" y="92" width="150" height="82" class="b"/><text x="257" y="126" class="x">第1层后 10</text><text x="257" y="154" class="s">6+4</text><line x1="383" y1="133" x2="423" y2="133" class="a"/><rect x="431" y="92" width="150" height="82" class="b"/><text x="455" y="126" class="x">第2层后 14</text><text x="455" y="154" class="s">10+4</text><line x1="581" y1="133" x2="621" y2="133" class="a"/><rect x="629" y="92" width="150" height="82" class="o"/><text x="653" y="126" class="x">第3层后 18</text><text x="653" y="154" class="s">14+4</text><text x="808" y="135" class="x">6+3×4=18</text><text x="40" y="228" class="x">过渡层可再用 1×1 卷积压通道、池化减高宽，防止激活持续膨胀。</text></svg>
