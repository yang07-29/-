<svg xmlns="http://www.w3.org/2000/svg" width="960" height="265" viewBox="0 0 960 265" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">批量规范化两样本手算</title><desc id="d">一和三均值二方差一，规范化为负一和一，缩放二平移零点五得到负一点五和二点五。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">x=[1,3]，手算时取 ε=0、γ=2、β=0.5</text><rect x="40" y="82" width="245" height="110" class="b"/><text x="64" y="116" class="x">均值 μ=2，方差 σ²=1</text><text x="64" y="153" class="x">标准化 x̂=[-1,1]</text><line x1="285" y1="137" x2="355" y2="137" class="a"/><rect x="363" y="82" width="245" height="110" class="b"/><text x="389" y="116" class="x">y=γx̂+β</text><text x="389" y="153" class="x">=2×x̂+0.5</text><line x1="608" y1="137" x2="678" y2="137" class="a"/><rect x="686" y="82" width="234" height="110" class="o"/><text x="718" y="120" class="x">输出 [-1.5,2.5]</text><text x="718" y="158" class="s">γ、β 可学习</text><text x="40" y="238" class="x">训练态用当前批统计并更新 running stats；评估态改用运行统计。</text></svg>
