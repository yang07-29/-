<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">VGG连续小卷积核参数对比</title><desc id="d">八通道时一个五乘五卷积有1600权重，两个三乘三卷积有1152权重且感受野同为五乘五。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}</style><text x="40" y="38" class="h">C=8：同样覆盖 5×5 感受野，参数量可以不同</text><rect x="55" y="75" width="360" height="125" class="b"/><text x="82" y="113" class="x">一层 5×5 卷积</text><text x="82" y="150" class="x">25×8×8 = 1600 个权重</text><text x="82" y="180" class="s">中间没有额外激活</text><rect x="545" y="75" width="360" height="125" class="o"/><text x="572" y="113" class="x">两层 3×3 卷积</text><text x="572" y="150" class="x">2×9×8×8 = 1152 个权重</text><text x="572" y="180" class="s">中间还能再接一次 ReLU</text><text x="438" y="145" font-size="28">↔</text><text x="40" y="238" class="x">比较成立的前提：步幅 1、合适填充、输入输出通道都近似为 8。</text></svg>
