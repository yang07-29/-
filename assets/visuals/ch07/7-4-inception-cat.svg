<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">Inception分支沿通道拼接</title><desc id="d">四个八乘八分支分别输出四六八二通道，拼接后为二十通道。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:16px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:10}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">四条分支高宽都为 8×8，才能沿通道维拼接</text><rect x="45" y="100" width="180" height="80" class="b"/><text x="67" y="132" class="x">输入 (1,16,8,8)</text><text x="80" y="160" class="s">共享给四分支</text><line x1="225" y1="140" x2="285" y2="140" class="a"/><text x="305" y="82" class="x">分支1：(1,4,8,8)</text><text x="305" y="120" class="x">分支2：(1,6,8,8)</text><text x="305" y="158" class="x">分支3：(1,8,8,8)</text><text x="305" y="196" class="x">分支4：(1,2,8,8)</text><line x1="520" y1="140" x2="620" y2="140" class="a"/><text x="535" y="117" class="s">cat dim=1</text><rect x="628" y="90" width="292" height="100" class="o"/><text x="660" y="130" class="x">Cout=4+6+8+2=20</text><text x="680" y="164" class="x">输出 (1,20,8,8)</text><text x="40" y="245" class="x">cat 不要求分支通道相同，但 N、H、W 必须一致。</text></svg>
