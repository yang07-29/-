<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">NiN全局平均池化手算</title><desc id="d">两个二乘二类别特征图分别求平均得到一比一点五和一，预测类别零。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">最后两个通道就是两个类别的空间证据图</text><rect x="40" y="75" width="280" height="130" class="b"/><text x="62" y="110" class="x">类别 0：[[1,3],[2,0]]</text><text x="62" y="145" class="x">平均 = 6/4 = 1.5</text><text x="62" y="180" class="s">一张 2×2 类别图</text><rect x="365" y="75" width="280" height="130" class="b"/><text x="387" y="110" class="x">类别 1：[[0,0],[2,2]]</text><text x="387" y="145" class="x">平均 = 4/4 = 1.0</text><text x="387" y="180" class="s">另一张 2×2 类别图</text><line x1="645" y1="140" x2="700" y2="140" class="a"/><rect x="708" y="90" width="212" height="100" class="o"/><text x="733" y="128" class="x">logits=[1.5,1.0]</text><text x="750" y="164" class="x">预测类别 0</text><text x="40" y="245" class="x">GAP 去掉 H、W，不新增权重；每个类别通道只剩一个全局平均分。</text></svg>
