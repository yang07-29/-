<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">残差块逐元素相加手算</title><desc id="d">输入二负一，残差零点五一，相加后二点五零，再经过ReLU保持不变。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.r{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}</style><text x="40" y="38" class="h">残差块不是拼接：两路同 Shape 后逐元素相加</text><rect x="45" y="80" width="220" height="100" class="b"/><text x="76" y="120" class="x">捷径 x=[2,-1]</text><text x="76" y="155" class="s">原信息直接通过</text><rect x="45" y="190" width="220" height="60" class="r"/><text x="76" y="227" class="x">残差 F(x)=[0.5,1]</text><text x="310" y="152" font-size="30">+</text><rect x="380" y="95" width="240" height="100" class="b"/><text x="412" y="135" class="x">F(x)+x=[2.5,0]</text><text x="412" y="170" class="s">Shape 仍为 (2,)</text><text x="650" y="152" font-size="28">→ ReLU →</text><rect x="785" y="95" width="135" height="100" class="o"/><text x="802" y="153" class="x">[2.5,0]</text><text x="380" y="238" class="x">若通道或高宽不同，先用 1×1 投影让捷径对齐。</text></svg>
