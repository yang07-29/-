<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">AlexNet中的ReLU手算</title><desc id="d">输入负二和三经过ReLU得到零和三，正数支路梯度为一。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">一个最小 ReLU：负响应关掉，正响应原样通过</text><rect x="50" y="78" width="220" height="110" class="b"/><text x="78" y="120" class="x">卷积预激活 z</text><text x="92" y="158" class="x">[-2, 3]</text><line x1="270" y1="133" x2="365" y2="133" class="a"/><text x="289" y="111" class="s">ReLU</text><rect x="373" y="78" width="230" height="110" class="o"/><text x="402" y="120" class="x">输出 max(0,z)</text><text x="452" y="158" class="x">[0, 3]</text><rect x="680" y="78" width="230" height="110" class="b"/><text x="708" y="120" class="x">局部导数</text><text x="754" y="158" class="x">[0, 1]</text><text x="40" y="228" class="x">正数区域梯度直接通过，但 ReLU 不会自动解决所有深层优化问题。</text></svg>
