<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">同一个边缘检测器在不同位置复用</title><desc id="d">左上和右下出现相同竖边，同一个二乘二卷积核都能检测。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">“左亮右暗”的竖边，换个位置仍是同一种模式</text><rect x="40" y="72" width="240" height="120" class="b"/><text x="62" y="108" class="x">图 A：竖边在左上</text><text x="62" y="142" class="s">局部块 [[1,0],[1,0]]</text><text x="62" y="172" class="s">核 [[1,-1],[1,-1]] → 2</text><line x1="280" y1="132" x2="350" y2="132" class="a"/><rect x="358" y="72" width="240" height="120" class="o"/><text x="380" y="108" class="x">同一个卷积核</text><text x="380" y="142" class="s">参数只学一份</text><text x="380" y="172" class="s">在所有位置滑动</text><line x1="598" y1="132" x2="668" y2="132" class="a"/><rect x="676" y="72" width="244" height="120" class="b"/><text x="698" y="108" class="x">图 B：竖边在右下</text><text x="698" y="142" class="s">相同局部块 → 2</text><text x="698" y="172" class="s">无需另学一组权重</text><text x="40" y="230" class="x">局部性决定“看附近”，参数共享决定“同一规则到处用”。</text></svg>
