<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">LeNet逐层Shape</title><desc id="d">二十八乘二十八图像经过两次卷积池化变为十六乘五乘五，再展平为400。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:15px}.s{font-size:14px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:10}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:10}.a{stroke:#64748b;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">一张 28×28 灰度图，逐层走到 10 类分数</text><rect x="28" y="92" width="116" height="76" class="b"/><text x="44" y="122" class="x">1×28×28</text><text x="44" y="149" class="s">输入</text><line x1="144" y1="130" x2="174" y2="130" class="a"/><rect x="178" y="92" width="116" height="76" class="b"/><text x="194" y="122" class="x">6×28×28</text><text x="194" y="149" class="s">Conv1</text><line x1="294" y1="130" x2="324" y2="130" class="a"/><rect x="328" y="92" width="116" height="76" class="b"/><text x="344" y="122" class="x">6×14×14</text><text x="344" y="149" class="s">Pool1</text><line x1="444" y1="130" x2="474" y2="130" class="a"/><rect x="478" y="92" width="116" height="76" class="b"/><text x="494" y="122" class="x">16×10×10</text><text x="494" y="149" class="s">Conv2</text><line x1="594" y1="130" x2="624" y2="130" class="a"/><rect x="628" y="92" width="116" height="76" class="b"/><text x="644" y="122" class="x">16×5×5</text><text x="644" y="149" class="s">Pool2</text><line x1="744" y1="130" x2="774" y2="130" class="a"/><rect x="778" y="92" width="154" height="76" class="o"/><text x="794" y="122" class="x">400 → 120 → 84 → 10</text><text x="794" y="149" class="s">展平与分类</text><text x="40" y="220" class="x">16×5×5=400；Flatten 只合并单个样本的通道和空间维。</text></svg>
