<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">填充步幅的输出尺寸手算</title><desc id="d">五乘五输入三乘三核，填充1步幅2，输出三乘三。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">H=5，K=3，P=1，S=2：先补边，再隔一格落一次</text><rect x="40" y="78" width="220" height="110" class="b"/><text x="62" y="114" class="x">原输入 5×5</text><text x="62" y="150" class="s">四周各补 1 圈</text><line x1="260" y1="133" x2="330" y2="133" class="a"/><rect x="338" y="78" width="250" height="110" class="b"/><text x="360" y="114" class="x">有效范围 7×7</text><text x="360" y="150" class="s">3×3 核按步幅 2 移动</text><line x1="588" y1="133" x2="658" y2="133" class="a"/><rect x="666" y="78" width="254" height="110" class="o"/><text x="688" y="114" class="x">floor((5+2-3)/2)+1</text><text x="688" y="153" class="x">输出高宽 = 3×3</text><text x="40" y="228" class="x">下取整表示尾部若放不下完整窗口，就不会额外产生输出格。</text></svg>
