<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">多输入通道逐通道卷积再求和</title><desc id="d">两个一乘一输入通道分别乘权重2和负1，再加偏置得到一个输出通道数值。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">一个输出通道，会把所有输入通道在同一位置的证据加起来</text><rect x="40" y="76" width="230" height="116" class="b"/><text x="62" y="112" class="x">通道 1 值 3</text><text x="62" y="148" class="s">对应 1×1 权重 2</text><text x="62" y="176" class="x">贡献 6</text><rect x="330" y="76" width="230" height="116" class="b"/><text x="352" y="112" class="x">通道 2 值 5</text><text x="352" y="148" class="s">对应 1×1 权重 -1</text><text x="352" y="176" class="x">贡献 -5</text><line x1="560" y1="134" x2="650" y2="134" class="a"/><rect x="658" y="76" width="262" height="116" class="o"/><text x="680" y="112" class="x">加偏置 0.5</text><text x="680" y="148" class="x">6 + (-5) + 0.5</text><text x="680" y="178" class="x">输出 = 1.5</text><text x="40" y="228" class="x">要两个输出通道，就准备两整组这样的通道权重。</text></svg>
