<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">二维互相关左上输出手算</title><desc id="d">二乘二局部块与核逐元素相乘求和得到零。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">一个输出格，只看核盖住的那块输入</text><rect x="40" y="78" width="220" height="110" class="b"/><text x="62" y="114" class="x">局部块 [[1,2],[0,1]]</text><text x="62" y="150" class="s">来自输入左上角</text><line x1="260" y1="133" x2="330" y2="133" class="a"/><rect x="338" y="78" width="220" height="110" class="b"/><text x="360" y="114" class="x">核 [[1,-1],[0,1]]</text><text x="360" y="150" class="s">对应位置相乘</text><line x1="558" y1="133" x2="628" y2="133" class="a"/><rect x="636" y="78" width="284" height="110" class="o"/><text x="658" y="114" class="x">1×1+2×(-1)+0×0+1×1</text><text x="658" y="153" class="x">输出左上格 = 0</text><text x="40" y="228" class="x">窗口每右移或下移一次，就换一个局部块重复同样计算。</text></svg>
