<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="t d"><rect width="100%" height="100%" fill="#ffffff"/><title id="t">二乘二最大池化和平均池化手算</title><desc id="d">窗口1 3 2 0的最大值为3平均值为1.5。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.max{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.avg{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}</style><text x="40" y="38" class="h">同一个 2×2 窗口，两种池化回答两个不同问题</text><rect x="40" y="78" width="240" height="120" class="b"/><text x="62" y="116" class="x">窗口 [[1,3],[2,0]]</text><text x="62" y="151" class="s">没有参数，也不做反向更新</text><rect x="360" y="78" width="240" height="120" class="max"/><text x="382" y="116" class="x">最大池化</text><text x="382" y="154" class="x">max = 3</text><text x="382" y="181" class="s">保留最强响应</text><rect x="680" y="78" width="240" height="120" class="avg"/><text x="702" y="116" class="x">平均池化</text><text x="702" y="154" class="x">(1+3+2+0)/4 = 1.5</text><text x="702" y="181" class="s">保留平均水平</text><text x="40" y="231" class="x">两者只压缩高宽；若输入有 C 个通道，输出仍有 C 个通道。</text></svg>
