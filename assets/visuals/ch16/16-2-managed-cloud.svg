<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">托管云训练的计算与持久化分离</title>
  <desc id="desc">训练实例可以停止，但代码、数据和模型产物要保存到持久化存储。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
    .h { font-size: 24px; font-weight: 700; }.t { font-size: 18px; }.s { font-size: 16px; fill: #4b5563; }
    .card { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 14; }.store { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 14; }.line { stroke: #64748b; stroke-width: 3; marker-end: url(#a); }
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <text x="42" y="44" class="h">托管平台省的是环境维护，不是实验记录</text>
  <rect x="42" y="82" width="230" height="104" class="card"/><text x="68" y="119" class="t">计算实例（临时）</text><text x="68" y="149" class="s">GPU、内存、运行中的进程</text><text x="68" y="174" class="s">训练结束即可停止</text>
  <line x1="272" y1="134" x2="359" y2="134" class="line"/>
  <rect x="364" y="82" width="230" height="104" class="store"/><text x="390" y="119" class="t">持久化存储</text><text x="390" y="149" class="s">代码、数据版本、checkpoint</text><text x="390" y="174" class="s">实例停止后仍保留</text>
  <line x1="594" y1="134" x2="681" y2="134" class="line"/>
  <rect x="686" y="82" width="230" height="104" class="store"/><text x="712" y="119" class="t">实验记录</text><text x="712" y="149" class="s">配置、指标、日志</text><text x="712" y="174" class="s">可复查、可恢复</text>
  <rect x="165" y="232" width="630" height="72" class="warn"/><text x="194" y="263" class="t">反例：只把 checkpoint 留在临时实例本地磁盘</text><text x="194" y="289" class="s">实例被释放后，训练结果可能一起消失；先持久化，再停止计算。</text>
</svg>
