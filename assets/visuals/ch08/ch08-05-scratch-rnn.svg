<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">one-hot 选择权重行</title><desc id="desc">零一零乘三乘二权重矩阵选出第二行，再加旧状态贡献并经过双曲正切。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">8.5 one-hot 矩阵乘法就是查一行</text>
  <rect x="40" y="90" width="250" height="205" rx="14" fill="#e0f2fe"/><text x="60" y="126" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">X=[0,1,0]</text><text x="70" y="169" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">W row0 [ 0.1, 0.2]</text><rect x="60" y="184" width="200" height="37" rx="7" fill="#7dd3fc"/><text x="70" y="208" font-family="Arial,sans-serif" font-size="15" fill="#082f49">W row1 [ 0.5,-0.5]</text><text x="70" y="249" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">W row2 [-0.2, 0.3]</text>
  <rect x="350" y="90" width="220" height="205" rx="14" fill="#ede9fe"/><text x="370" y="126" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">加旧状态贡献</text><text x="374" y="180" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">[0.5,-0.5]</text><text x="374" y="215" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">+[0.2, 0.4]</text><text x="395" y="255" font-family="Arial,sans-serif" font-size="19" fill="#0f172a">=[0.7,-0.1]</text>
  <rect x="640" y="90" width="240" height="205" rx="14" fill="#dcfce7"/><text x="660" y="126" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">逐元素 tanh</text><text x="682" y="192" font-family="Arial,sans-serif" font-size="21" fill="#166534">[0.604,-0.100]</text><text x="704" y="238" font-family="Arial,sans-serif" font-size="16" fill="#334155">Shape (1,2)</text>
