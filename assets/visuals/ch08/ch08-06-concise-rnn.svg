<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">nn RNN Shape 流程</title><desc id="desc">二乘三整数输入转为三乘二乘四 one-hot，循环层输出三乘二乘五，线性层输出六乘四。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">8.6 框架省掉循环，不省掉 Shape 推演</text>
  <rect x="32" y="112" width="165" height="100" rx="13" fill="#e0f2fe"/><text x="59" y="151" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#075985">整数输入</text><text x="78" y="185" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">(2,3)</text>
  <rect x="235" y="112" width="165" height="100" rx="13" fill="#ede9fe"/><text x="251" y="151" font-family="Arial,sans-serif" font-size="15" fill="#5b21b6">transpose+onehot</text><text x="278" y="185" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">(3,2,4)</text>
  <rect x="438" y="88" width="190" height="148" rx="13" fill="#fef3c7"/><text x="489" y="126" font-family="Arial,sans-serif" font-size="16" fill="#92400e">nn.RNN</text><text x="474" y="166" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">outputs (3,2,5)</text><text x="468" y="204" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">state (1,2,5)</text>
  <rect x="666" y="112" width="210" height="100" rx="13" fill="#dcfce7"/><text x="703" y="151" font-family="Arial,sans-serif" font-size="15" fill="#166534">reshape+Linear</text><text x="733" y="185" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">(6,4)</text>
  <path d="M197 162H227M400 162H430M628 162H658" stroke="#64748b" stroke-width="3"/><path d="M220 154l10 8-10 8M423 154l10 8-10 8M651 154l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
  <text x="392" y="292" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">状态第一维始终是 层数×方向数，不跟 batch_first 交换</text>
</svg>
