<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">窗口三生成监督样本</title><desc id="desc">长度五的序列用长度四的滑动窗口生成两行三维特征与两行一维标签。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">8.1 过去 3 点预测下一点</text>
  <rect x="45" y="88" width="230" height="210" rx="14" fill="#e0f2fe"/><text x="65" y="124" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">原序列</text><text x="66" y="178" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">10, 12, 15, 14, 18</text><text x="66" y="224" font-family="Arial,sans-serif" font-size="17" fill="#334155">tau = 3</text>
  <rect x="335" y="88" width="250" height="210" rx="14" fill="#ede9fe"/><text x="355" y="124" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">长度 4 的窗口</text><text x="355" y="174" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">[10,12,15 | 14]</text><text x="355" y="216" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">[12,15,14 | 18]</text>
  <rect x="645" y="88" width="230" height="210" rx="14" fill="#dcfce7"/><text x="665" y="124" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">具体输出</text><text x="665" y="169" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">X: (2,3)</text><text x="665" y="207" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">y: (2,1)</text><text x="665" y="251" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#334155">标签列保留二维</text>
  <path d="M275 193H327M585 193H637" stroke="#64748b" stroke-width="3"/><path d="M320 185l10 8-10 8M630 185l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
