<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">字符文本编码</title><desc id="desc">time 问号按字符切分，已知字符查固定索引，未知问号映射到零。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">8.2 词元化先切单位，词表再给编号</text>
  <rect x="45" y="95" width="210" height="185" rx="14" fill="#e0f2fe"/><text x="65" y="132" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">输入文本</text><text x="104" y="202" font-family="Arial,sans-serif" font-size="30" fill="#0f172a">time?</text>
  <rect x="355" y="95" width="210" height="185" rx="14" fill="#ede9fe"/><text x="375" y="132" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">字符 → 索引</text><text x="383" y="177" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">t i m e ?</text><text x="383" y="220" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">1 2 3 4 0</text><text x="383" y="252" font-family="Arial,sans-serif" font-size="14" fill="#64748b">? → &lt;unk&gt;</text>
  <rect x="665" y="95" width="210" height="185" rx="14" fill="#dcfce7"/><text x="685" y="132" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">输出</text><text x="705" y="180" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Shape (5,)</text><text x="698" y="220" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">time&lt;unk&gt;</text>
