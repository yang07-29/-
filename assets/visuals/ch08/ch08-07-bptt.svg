<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">三步梯度连乘</title><desc id="desc">每步导数零点五时三步梯度为零点一二五，每步导数二时三步梯度为八。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">8.7 同样走 3 步，连乘可以缩小也可以放大</text>
  <rect x="45" y="92" width="390" height="205" rx="14" fill="#e0f2fe"/><text x="65" y="130" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">每步局部导数 a=0.5</text><text x="72" y="185" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">1 × 0.5 × 0.5 × 0.5</text><text x="174" y="236" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#075985">= 0.125</text><text x="168" y="272" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#334155">梯度消失方向</text>
  <rect x="485" y="92" width="390" height="205" rx="14" fill="#fee2e2"/><text x="505" y="130" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#991b1b">每步局部导数 a=2</text><text x="555" y="185" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">1 × 2 × 2 × 2</text><text x="653" y="236" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#991b1b">= 8</text><text x="625" y="272" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#334155">梯度爆炸方向</text>
</svg>
