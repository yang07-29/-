  <rect x="645" y="88" width="230" height="210" rx="14" fill="#dcfce7"/><text x="665" y="124" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">时间优先展平</text><text x="675" y="179" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">b,y,c,z,d,w</text><text x="675" y="226" font-family="Arial,sans-serif" font-size="17" fill="#166534">Shape (6,)</text>
