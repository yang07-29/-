<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">标量 RNN 两步计算</title><desc id="desc">第一步输入一得到状态零点七六二，第二步输入零仍通过旧状态得到零点三六四。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">8.4 当前输入为 0，过去仍能留下痕迹</text>
  <rect x="45" y="100" width="245" height="170" rx="14" fill="#e0f2fe"/><text x="65" y="136" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">第 1 步</text><text x="65" y="181" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">X1=1, H0=0</text><text x="65" y="222" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">H1=tanh(1)=0.762</text>
  <rect x="345" y="100" width="245" height="170" rx="14" fill="#ede9fe"/><text x="365" y="136" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">第 2 步</text><text x="365" y="181" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">X2=0, W_hh=0.5</text><text x="365" y="222" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">H2=tanh(0.381)</text>
  <rect x="645" y="100" width="230" height="170" rx="14" fill="#dcfce7"/><text x="665" y="136" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">具体输出</text><text x="695" y="190" font-family="Arial,sans-serif" font-size="25" fill="#166534">H2≈0.364</text><text x="685" y="230" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#334155">来自上一时刻状态</text>
  <path d="M290 185H337M590 185H637" stroke="#64748b" stroke-width="3"/><path d="M330 177l10 8-10 8M630 177l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
