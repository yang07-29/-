<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">机器翻译批量补齐</title><desc id="desc">两条不同长度的源句追加结束符并补齐到三，目标句添加开始结束符并补齐到四。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">9.5 特殊词元与有效长度各有职责</text>
  <text x="45" y="102" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">源端 source (2,3)</text><rect x="45" y="120" width="370" height="58" rx="10" fill="#e0f2fe"/><text x="66" y="156" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">go　.　&lt;eos&gt;　 length=3</text><rect x="45" y="188" width="370" height="58" rx="10" fill="#e0f2fe"/><text x="66" y="224" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">hi　&lt;eos&gt;　</text><text x="187" y="224" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8">&lt;pad&gt;</text><text x="260" y="224" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">length=2</text>
  <text x="495" y="102" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">目标端 target (2,4)</text><rect x="495" y="120" width="380" height="58" rx="10" fill="#ede9fe"/><text x="516" y="156" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">&lt;bos&gt; va ! &lt;eos&gt;　 length=4</text><rect x="495" y="188" width="380" height="58" rx="10" fill="#ede9fe"/><text x="516" y="224" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">&lt;bos&gt; salut &lt;eos&gt;</text><text x="675" y="224" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8">&lt;pad&gt;</text><text x="748" y="224" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">len=3</text>
  <text x="126" y="293" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">eos 是真实内容终点；pad 只是矩形补位</text><text x="582" y="293" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">bos 启动解码；eos 必须成为预测目标</text>
</svg>
