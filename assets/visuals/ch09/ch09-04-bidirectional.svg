<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">双向 RNN 汇合左右上下文</title><desc id="desc">我不开心中的不，正向摘要读取我不，反向摘要读取开心不，两份二维状态拼成四维表示。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">9.4 “不”的含义同时依赖左边和右边</text>
  <rect x="365" y="86" width="190" height="62" rx="12" fill="#fef3c7"/><text x="404" y="126" font-family="Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#92400e">我　不　开心</text>
  <rect x="75" y="205" width="280" height="100" rx="14" fill="#e0f2fe"/><text x="95" y="240" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#075985">正向在“不”处</text><text x="95" y="276" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#0f172a">已读 [我,不] → (1,2)</text>
  <rect x="565" y="205" width="280" height="100" rx="14" fill="#ede9fe"/><text x="585" y="240" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#5b21b6">反向在“不”处</text><text x="585" y="276" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#0f172a">已读 [开心,不] → (1,2)</text>
