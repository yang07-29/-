<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">编码器解码器变长转换</title><desc id="desc">四词元源序列编码为二维上下文，解码器从开始符依次生成一四二与结束符。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">9.6 一个固定摘要，启动另一条时间轴</text>
  <rect x="35" y="112" width="230" height="120" rx="14" fill="#e0f2fe"/><text x="55" y="150" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">源序列</text><text x="55" y="194" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">one four two &lt;eos&gt;</text>
  <rect x="325" y="112" width="190" height="120" rx="14" fill="#fef3c7"/><text x="363" y="150" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#92400e">Encoder</text><text x="365" y="194" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">c=[0.7,-0.2]</text>
  <rect x="575" y="92" width="310" height="160" rx="14" fill="#dcfce7"/><text x="595" y="130" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">Decoder 逐步输出</text><text x="603" y="177" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">&lt;bos&gt; → 一 → 四 → 二 → &lt;eos&gt;</text><text x="641" y="219" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">正文输出：[一,四,二]</text>
  <path d="M265 172H317M515 172H567" stroke="#64748b" stroke-width="3"/><path d="M310 164l10 8-10 8M560 164l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
  <text x="301" y="293" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">输入 4 个词元，输出正文 3 个词元：长度无需相同</text>
</svg>
