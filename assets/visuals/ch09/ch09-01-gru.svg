<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">GRU 更新门逐维插值</title><desc id="desc">旧状态十和二、候选状态零和六、更新门零点九和零点二五，得到新状态九和五。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">9.1 一扇更新门，每个隐藏维有自己的开度</text>
  <rect x="45" y="92" width="245" height="205" rx="14" fill="#e0f2fe"/><text x="65" y="130" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">小输入</text><text x="65" y="174" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">H_prev=[10,2]</text><text x="65" y="211" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">H_tilde=[0,6]</text><text x="65" y="248" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Z=[0.9,0.25]</text>
  <rect x="345" y="92" width="270" height="205" rx="14" fill="#ede9fe"/><text x="365" y="130" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">逐维插值</text><text x="365" y="178" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">0.9×10 + 0.1×0 = 9</text><text x="365" y="218" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">0.25×2 + 0.75×6 = 5</text><text x="365" y="256" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#334155">第1维保留，第2维改写</text>
  <rect x="670" y="112" width="205" height="165" rx="14" fill="#dcfce7"/><text x="690" y="150" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">具体输出</text><text x="714" y="211" font-family="Arial,sans-serif" font-size="27" fill="#166534">H=[9,5]</text>
  <path d="M290 195H337M615 195H662" stroke="#64748b" stroke-width="3"/><path d="M330 187l10 8-10 8M655 187l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
