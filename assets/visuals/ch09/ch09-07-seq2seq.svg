  <title id="title">teacher forcing 与遮蔽损失</title><desc id="desc">两条目标序列左右错位构成输入标签，五个有效词元损失和一点二，平均零点二四，补位九点零被遮蔽。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
