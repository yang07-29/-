<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">LSTM 记忆与输出手算</title><desc id="desc">旧记忆四乘遗忘门零点七五，加候选零点八乘输入门零点五，得到记忆三点四；输出门零点二五得到状态约零点二四九。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">9.2 内部记得多，不代表这一刻全说出来</text>
  <rect x="40" y="95" width="250" height="195" rx="14" fill="#e0f2fe"/><text x="60" y="132" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">门与候选</text><text x="60" y="176" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">C_prev=4　F=0.75</text><text x="60" y="214" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">C_tilde=0.8　I=0.5</text><text x="60" y="252" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">O=0.25</text>
  <rect x="345" y="95" width="250" height="195" rx="14" fill="#ede9fe"/><text x="365" y="132" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">更新内部记忆</text><text x="365" y="181" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">C=0.75×4+0.5×0.8</text><text x="440" y="226" font-family="Arial,sans-serif" font-size="24" fill="#5b21b6">=3.4</text>
  <rect x="650" y="95" width="230" height="195" rx="14" fill="#dcfce7"/><text x="670" y="132" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">对外状态</text><text x="670" y="181" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">H=0.25×tanh(3.4)</text><text x="714" y="226" font-family="Arial,sans-serif" font-size="24" fill="#166534">≈0.249</text><text x="690" y="259" font-family="Arial,sans-serif" font-size="14" fill="#334155">C ≠ H</text>
  <path d="M290 193H337M595 193H642" stroke="#64748b" stroke-width="3"/><path d="M330 185l10 8-10 8M635 185l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
