<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">两层循环网络 Shape</title><desc id="desc">二乘三乘四输入经过第一层成为二乘三乘五，再经过第二层仍为二乘三乘五，最终状态为二乘二乘五。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">9.3 层数增加纵向深度，不自动拼宽输出</text>
  <rect x="50" y="130" width="190" height="95" rx="13" fill="#e0f2fe"/><text x="89" y="166" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#075985">输入 X</text><text x="103" y="201" font-family="Arial,sans-serif" font-size="19" fill="#0f172a">(2,3,4)</text>
  <rect x="315" y="95" width="210" height="95" rx="13" fill="#ede9fe"/><text x="358" y="131" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#5b21b6">第 1 层</text><text x="374" y="166" font-family="Arial,sans-serif" font-size="19" fill="#0f172a">(2,3,5)</text>
  <rect x="315" y="215" width="210" height="95" rx="13" fill="#ddd6fe"/><text x="358" y="251" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#5b21b6">第 2 层</text><text x="374" y="286" font-family="Arial,sans-serif" font-size="19" fill="#0f172a">(2,3,5)</text>
  <rect x="650" y="103" width="225" height="175" rx="14" fill="#dcfce7"/><text x="670" y="140" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">模块输出</text><text x="681" y="181" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">outputs (2,3,5)</text><text x="688" y="222" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">state (2,2,5)</text><text x="692" y="253" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#334155">第一维是 2 层</text>
