<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">核回归的局部加权</title><desc id="desc">查询点附近训练样本权重大，远处样本权重小。</desc>
  <rect width="900" height="360" rx="24" fill="#f8fafc"/><text x="45" y="55" font-size="27" font-weight="700" fill="#0f172a">10.2 核回归：问谁近，就多听谁</text>
  <line x1="90" y1="270" x2="820" y2="270" stroke="#64748b" stroke-width="3"/><text x="825" y="276" font-size="18" fill="#475569">x</text>
  <circle cx="160" cy="240" r="10" fill="#94a3b8"/><circle cx="300" cy="180" r="15" fill="#3b82f6"/><circle cx="440" cy="125" r="24" fill="#2563eb"/><circle cx="580" cy="190" r="13" fill="#60a5fa"/><circle cx="730" cy="235" r="8" fill="#cbd5e1"/>
  <line x1="400" y1="90" x2="400" y2="282" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 7"/><text x="400" y="315" text-anchor="middle" font-size="19" fill="#991b1b">查询 q=1.6</text>
  <path d="M400 100C420 90 430 100 440 115" fill="none" stroke="#ef4444" stroke-width="2"/><text x="535" y="85" font-size="18" fill="#334155">圆越大 = softmax 权重越大</text>
  <rect x="95" y="78" width="210" height="58" rx="12" fill="#e0f2fe"/><text x="200" y="113" text-anchor="middle" font-size="18" fill="#0c4a6e">预测 = Σ α(q,kᵢ)vᵢ</text>
</svg>
