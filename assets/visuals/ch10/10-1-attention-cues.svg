<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">注意力提示与查询键值</title><desc id="desc">查询和键决定权重，权重对值做加权汇聚。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="900" height="360" rx="24" fill="#f8fafc"/><text x="45" y="55" font-size="27" font-weight="700" fill="#0f172a">10.1 注意力：先决定“找什么”，再读取内容</text>
  <rect x="55" y="115" width="170" height="90" rx="16" fill="#dbeafe"/><text x="140" y="150" text-anchor="middle" font-size="22" fill="#1e3a8a">查询 Q</text><text x="140" y="182" text-anchor="middle" font-size="17" fill="#334155">我在找“红杯子”</text>
  <rect x="365" y="90" width="170" height="90" rx="16" fill="#fef3c7"/><text x="450" y="125" text-anchor="middle" font-size="22" fill="#78350f">键 K</text><text x="450" y="157" text-anchor="middle" font-size="17" fill="#334155">每件物品的标签</text>
  <rect x="365" y="220" width="170" height="90" rx="16" fill="#dcfce7"/><text x="450" y="255" text-anchor="middle" font-size="22" fill="#14532d">值 V</text><text x="450" y="287" text-anchor="middle" font-size="17" fill="#334155">物品的实际内容</text>
  <rect x="685" y="145" width="165" height="90" rx="16" fill="#ede9fe"/><text x="767" y="180" text-anchor="middle" font-size="21" fill="#4c1d95">加权汇聚</text><text x="767" y="211" text-anchor="middle" font-size="17" fill="#334155">相关内容占比更大</text>
  <path d="M225 160H350" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M535 135C610 135 610 175 670 180" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M535 265C610 265 610 220 670 205" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <text x="277" y="145" font-size="16" fill="#64748b">相似度</text><text x="590" y="295" font-size="16" fill="#64748b">权重乘 V</text>
</svg>
