<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Transformer编码器解码器结构</title><desc id="desc">编码器使用自注意力与前馈网络，解码器增加因果自注意力和交叉注意力。</desc>
