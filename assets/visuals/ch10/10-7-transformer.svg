  <rect x="65" y="100" width="280" height="205" rx="20" fill="#dbeafe"/><text x="205" y="132" text-anchor="middle" font-size="22" fill="#1e3a8a">Encoder × N</text><rect x="100" y="155" width="210" height="48" rx="10" fill="#fff"/><text x="205" y="185" text-anchor="middle" font-size="17" fill="#334155">多头自注意力 + AddNorm</text><rect x="100" y="225" width="210" height="48" rx="10" fill="#fff"/><text x="205" y="255" text-anchor="middle" font-size="17" fill="#334155">逐位置 FFN + AddNorm</text>
