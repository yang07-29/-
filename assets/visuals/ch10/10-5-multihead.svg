<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">多头注意力分头与合并</title><desc id="desc">D维投影分成h个头，每头宽D除以h，拼接后再投影。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="900" height="360" rx="24" fill="#f8fafc"/><text x="45" y="52" font-size="27" font-weight="700" fill="#0f172a">10.5 多头：同一段话，同时从多种关系观察</text>
  <rect x="45" y="145" width="150" height="80" rx="14" fill="#dbeafe"/><text x="120" y="178" text-anchor="middle" font-size="20" fill="#1e3a8a">X (B,T,D)</text><text x="120" y="205" text-anchor="middle" font-size="16" fill="#334155">Q/K/V 投影</text>
  <g font-size="17" text-anchor="middle"><rect x="290" y="82" width="185" height="55" rx="12" fill="#fee2e2"/><text x="382" y="116" fill="#7f1d1d">头 1：位置关系</text><rect x="290" y="153" width="185" height="55" rx="12" fill="#fef3c7"/><text x="382" y="187" fill="#78350f">头 2：语义关系</text><rect x="290" y="224" width="185" height="55" rx="12" fill="#dcfce7"/><text x="382" y="258" fill="#14532d">… 头 h：(B,T,D/h)</text></g>
  <rect x="570" y="125" width="130" height="120" rx="16" fill="#ede9fe"/><text x="635" y="173" text-anchor="middle" font-size="20" fill="#4c1d95">Concat</text><text x="635" y="207" text-anchor="middle" font-size="17" fill="#334155">→ (B,T,D)</text>
  <rect x="755" y="145" width="110" height="80" rx="14" fill="#e0f2fe"/><text x="810" y="179" text-anchor="middle" font-size="19" fill="#0c4a6e">Wₒ</text><text x="810" y="205" text-anchor="middle" font-size="16" fill="#334155">混合各头</text>
  <path d="M195 185H275" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M475 108C530 108 530 150 555 160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M475 180H555" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M475 251C530 251 530 220 555 210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M700 185H740" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
</svg>
