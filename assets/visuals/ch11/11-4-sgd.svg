<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">随机梯度下降抽一个样本</title><desc id="desc">每次抽取样本得到有噪声但平均无偏的梯度方向。</desc><rect width="900" height="360" rx="24" fill="#f8fafc"/><text x="45" y="52" font-size="27" font-weight="700" fill="#0f172a">11.4 SGD：每次问一位“路人”，方向会抖但便宜</text>
  <g fill="#dbeafe" stroke="#60a5fa" stroke-width="2"><circle cx="130" cy="155" r="34"/><circle cx="230" cy="235" r="34"/><circle cx="325" cy="125" r="34"/><circle cx="420" cy="220" r="34"/></g><g text-anchor="middle" font-size="18" fill="#1e3a8a"><text x="130" y="161">样本1</text><text x="230" y="241">样本2</text><text x="325" y="131">样本3</text><text x="420" y="226">样本4</text></g>
  <path d="M470 180L580 130" stroke="#ef4444" stroke-width="5"/><path d="M470 180L560 235" stroke="#f59e0b" stroke-width="5"/><path d="M470 180L625 180" stroke="#16a34a" stroke-width="6"/><text x="655" y="185" font-size="18" fill="#14532d">平均方向 ∇f</text><text x="595" y="118" font-size="17" fill="#991b1b">一次随机梯度</text><text x="580" y="260" font-size="17" fill="#92400e">另一次随机梯度</text>
  <rect x="690" y="115" width="155" height="120" rx="16" fill="#dcfce7"/><text x="767" y="151" text-anchor="middle" font-size="19" fill="#14532d">期望无偏</text><text x="767" y="185" text-anchor="middle" font-size="17" fill="#334155">E[gᵢ]=∇f</text><text x="767" y="215" text-anchor="middle" font-size="16" fill="#334155">单步并不精确</text>
</svg>
