<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">AdaGrad按坐标缩放步长</title><desc id="desc">频繁出现大梯度的坐标累计平方大，后续有效步长更小。</desc><rect width="900" height="360" rx="24" fill="#f8fafc"/><text x="45" y="52" font-size="27" font-weight="700" fill="#0f172a">11.7 AdaGrad：走得多的方向，后来自动放慢</text>
  <rect x="70" y="105" width="340" height="205" rx="18" fill="#dbeafe"/><text x="240" y="143" text-anchor="middle" font-size="21" fill="#1e3a8a">坐标 A：梯度 [4, 4]</text><text x="240" y="182" text-anchor="middle" font-size="19" fill="#334155">s = 4²+4² = 32</text><text x="240" y="222" text-anchor="middle" font-size="18" fill="#334155">下一步除以 √32</text><text x="240" y="267" text-anchor="middle" font-size="24" fill="#1d4ed8">有效步长较小</text>
  <rect x="490" y="105" width="340" height="205" rx="18" fill="#dcfce7"/><text x="660" y="143" text-anchor="middle" font-size="21" fill="#14532d">坐标 B：梯度 [1, 1]</text><text x="660" y="182" text-anchor="middle" font-size="19" fill="#334155">s = 1²+1² = 2</text><text x="660" y="222" text-anchor="middle" font-size="18" fill="#334155">下一步除以 √2</text><text x="660" y="267" text-anchor="middle" font-size="24" fill="#15803d">有效步长较大</text>
</svg>
