<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">RMSProp指数移动平均</title><desc id="desc">旧平方梯度按衰减系数逐渐遗忘，近期梯度影响更大。</desc><rect width="900" height="360" rx="24" fill="#f8fafc"/><text x="45" y="52" font-size="27" font-weight="700" fill="#0f172a">11.8 RMSProp：只保留“近期路况”的平方梯度</text>
  <g text-anchor="middle"><rect x="65" y="130" width="150" height="100" rx="15" fill="#e2e8f0"/><text x="140" y="169" font-size="20" fill="#475569">旧 sₜ₋₁</text><text x="140" y="202" font-size="18" fill="#334155">× γ=0.9</text><text x="275" y="190" font-size="36" fill="#475569">+</text><rect x="340" y="130" width="175" height="100" rx="15" fill="#fee2e2"/><text x="427" y="169" font-size="20" fill="#7f1d1d">当前 gₜ²</text><text x="427" y="202" font-size="18" fill="#334155">× (1-γ)</text><text x="565" y="190" font-size="36" fill="#475569">=</text><rect x="635" y="115" width="200" height="130" rx="16" fill="#dbeafe"/><text x="735" y="159" font-size="20" fill="#1e3a8a">新 sₜ</text><text x="735" y="194" font-size="18" fill="#334155">近期尺度估计</text><text x="735" y="222" font-size="17" fill="#334155">更新除以 √sₜ</text></g>
  <text x="450" y="305" text-anchor="middle" font-size="18" fill="#475569">与 AdaGrad 的关键差别：历史不会永久只增不减</text>
</svg>
