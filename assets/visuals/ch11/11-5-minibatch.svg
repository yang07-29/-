<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">小批量与向量化</title><desc id="desc">多个样本堆叠成矩阵，一次矩阵乘法计算整批预测和平均梯度。</desc><rect width="900" height="360" rx="24" fill="#f8fafc"/><text x="45" y="52" font-size="27" font-weight="700" fill="#0f172a">11.5 小批量：把 4 份作业摞起来一次批改</text>
  <g fill="#dbeafe"><rect x="65" y="100" width="210" height="42" rx="8"/><rect x="65" y="150" width="210" height="42" rx="8"/><rect x="65" y="200" width="210" height="42" rx="8"/><rect x="65" y="250" width="210" height="42" rx="8"/></g><g font-size="17" text-anchor="middle" fill="#1e3a8a"><text x="170" y="127">x₁ · (1,D)</text><text x="170" y="177">x₂ · (1,D)</text><text x="170" y="227">x₃ · (1,D)</text><text x="170" y="277">x₄ · (1,D)</text></g>
  <text x="325" y="205" font-size="34" fill="#475569">→</text><rect x="385" y="120" width="185" height="150" rx="16" fill="#fef3c7"/><text x="477" y="170" text-anchor="middle" font-size="21" fill="#78350f">X (4,D)</text><text x="477" y="205" text-anchor="middle" font-size="18" fill="#334155">一次 Xw</text><text x="477" y="235" text-anchor="middle" font-size="17" fill="#334155">硬件并行</text>
  <text x="610" y="205" font-size="34" fill="#475569">→</text><rect x="680" y="135" width="165" height="120" rx="16" fill="#dcfce7"/><text x="762" y="176" text-anchor="middle" font-size="20" fill="#14532d">平均梯度</text><text x="762" y="211" text-anchor="middle" font-size="18" fill="#334155">噪声与吞吐量</text><text x="762" y="237" text-anchor="middle" font-size="17" fill="#334155">取得折中</text>
</svg>
