<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">链式法则的数值反向传播</title><desc id="d">x2 w3 b负1得到z5和ReLU5，目标1，损失8，梯度w为8。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">x=2，w=3，b=-1，y=1：沿原路把局部梯度乘回去</text><rect x="40" y="85" width="176" height="108" class="b"/><text x="60" y="120" class="x">z=xw+b=5</text><text x="60" y="153" class="s">∂z/∂w = x = 2</text><line x1="216" y1="139" x2="286" y2="139" class="a"/><rect x="294" y="85" width="176" height="108" class="b"/><text x="314" y="120" class="x">a=ReLU(z)=5</text><text x="314" y="153" class="s">∂a/∂z = 1</text><line x1="470" y1="139" x2="540" y2="139" class="a"/><rect x="548" y="85" width="176" height="108" class="b"/><text x="568" y="120" class="x">L=½(5-1)²=8</text><text x="568" y="153" class="s">∂L/∂a = 4</text><line x1="724" y1="139" x2="774" y2="139" class="a"/><rect x="782" y="85" width="138" height="108" class="o"/><text x="802" y="120" class="x">w.grad</text><text x="802" y="153" class="x">4×1×2=8</text><text x="40" y="230" class="x">若 z&lt;0，ReLU 局部梯度为 0，这条路径传回 w 的贡献也为 0。</text></svg>
