<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">训练误差与验证误差辨别过拟合</title><desc id="d">小模型两边误差都高，合适模型两边低，大模型训练低验证高。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.bad{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.good{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}</style><text x="40" y="38" class="h">只看训练分数，会把“记住了”误当成“学会了”</text><rect x="40" y="78" width="270" height="126" class="bad"/><text x="62" y="112" class="x">模型 A：太简单</text><text x="62" y="145" class="s">训练误差 0.40</text><text x="62" y="173" class="s">验证误差 0.42</text><text x="62" y="198" class="x">欠拟合</text><rect x="345" y="78" width="270" height="126" class="good"/><text x="367" y="112" class="x">模型 B：合适</text><text x="367" y="145" class="s">训练误差 0.10</text><text x="367" y="173" class="s">验证误差 0.12</text><text x="367" y="198" class="x">泛化较好</text><rect x="650" y="78" width="270" height="126" class="bad"/><text x="672" y="112" class="x">模型 C：太复杂</text><text x="672" y="145" class="s">训练误差 0.01</text><text x="672" y="173" class="s">验证误差 0.31</text><text x="672" y="198" class="x">过拟合</text><text x="40" y="242" class="x">选 B 的依据是验证表现，不是 C 的训练误差最低。</text></svg>
