<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">K折验证中预处理避免泄漏</title><desc id="d">均值标准差只由训练折拟合，再应用到验证折，不能用全数据统计量。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.bad{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">一折验证：验证样本只能被 transform，不能参与 fit</text><rect x="40" y="80" width="230" height="126" class="b"/><text x="62" y="115" class="x">训练折价格</text><text x="62" y="147" class="s">[10,12,14]</text><text x="62" y="177" class="s">拟合均值 12</text><line x1="270" y1="143" x2="350" y2="143" class="a"/><rect x="358" y="80" width="230" height="126" class="o"/><text x="380" y="115" class="x">验证折价格 [100]</text><text x="380" y="147" class="s">只使用训练均值 12</text><text x="380" y="177" class="s">检验外推是否可靠</text><rect x="664" y="80" width="256" height="126" class="bad"/><text x="686" y="115" class="x">错误：全数据先求均值</text><text x="686" y="147" class="s">100 偷偷影响预处理</text><text x="686" y="177" class="s">验证分数过于乐观</text><text x="40" y="245" class="x">每一折都要重新 fit 预处理器、重新初始化模型，再在该折验证。</text></svg>
