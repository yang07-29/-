<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">XOR说明线性层叠仍是线性</title><desc id="d">四个角交错分类，一条直线不能分开，隐藏特征加非线性可以形成弯折边界。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.p{fill:#3b82f6}.n{fill:#f97316}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">XOR：四个点交错，一条直线无论怎样放都会分错</text><rect x="40" y="64" width="300" height="160" class="b"/><circle cx="110" cy="105" r="13" class="p"/><circle cx="270" cy="185" r="13" class="p"/><circle cx="270" cy="105" r="13" class="n"/><circle cx="110" cy="185" r="13" class="n"/><text x="70" y="92" class="s">A</text><text x="290" y="202" class="s">A</text><text x="290" y="92" class="s">B</text><text x="70" y="202" class="s">B</text><line x1="340" y1="144" x2="430" y2="144" class="a"/><rect x="438" y="82" width="200" height="124" class="b"/><text x="462" y="118" class="x">Linear → Linear</text><text x="462" y="150" class="s">仍可合并成一条直线</text><text x="462" y="180" class="s">仍然分不开</text><line x1="638" y1="144" x2="708" y2="144" class="a"/><rect x="716" y="82" width="204" height="124" class="b"/><text x="738" y="118" class="x">Linear → ReLU → Linear</text><text x="738" y="150" class="s">先造两个中间特征</text><text x="738" y="180" class="s">边界可以弯折</text></svg>
