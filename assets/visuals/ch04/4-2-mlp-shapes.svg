<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">两层MLP参数和Shape手算</title><desc id="d">批量2乘2输入通过2乘3权重和3乘2权重，得到2乘2输出。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="40" class="h">先核 Shape，再数参数：d=2，h=3，q=2，B=2</text><rect x="40" y="88" width="150" height="96" class="b"/><text x="64" y="124" class="x">X: (2,2)</text><text x="64" y="157" class="s">两样本、两特征</text><line x1="190" y1="136" x2="250" y2="136" class="a"/><text x="200" y="116" class="s">W1:(2,3)</text><rect x="258" y="88" width="164" height="96" class="b"/><text x="282" y="124" class="x">H: (2,3)</text><text x="282" y="157" class="s">ReLU 后隐藏量</text><line x1="422" y1="136" x2="482" y2="136" class="a"/><text x="432" y="116" class="s">W2:(3,2)</text><rect x="490" y="88" width="164" height="96" class="o"/><text x="514" y="124" class="x">O: (2,2)</text><text x="514" y="157" class="s">两类 logits</text><rect x="704" y="78" width="216" height="116" class="b"/><text x="728" y="114" class="x">参数量</text><text x="728" y="146" class="s">2×3+3 + 3×2+2</text><text x="728" y="174" class="x">= 17</text><text x="40" y="226" class="x">四组参数：W1、b1、W2、b2；激活函数没有可训练参数。</text></svg>
