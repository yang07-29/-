<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">Module参数注册与优化器更新</title><desc id="d">Sequential注册两层Linear的四组参数，model.parameters交给优化器，backward后step更新。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">框架管理参数，但更新仍要等 backward 产生梯度</text><rect x="40" y="78" width="230" height="130" class="b"/><text x="62" y="112" class="x">nn.Sequential</text><text x="62" y="143" class="s">Linear 1：weight、bias</text><text x="62" y="171" class="s">ReLU：无参数</text><text x="62" y="199" class="s">Linear 2：weight、bias</text><line x1="270" y1="143" x2="350" y2="143" class="a"/><rect x="358" y="90" width="230" height="106" class="b"/><text x="380" y="124" class="x">model.parameters()</text><text x="380" y="156" class="s">返回已注册的四组参数</text><text x="380" y="182" class="s">未注册张量不会出现</text><line x1="588" y1="143" x2="668" y2="143" class="a"/><rect x="676" y="90" width="244" height="106" class="o"/><text x="698" y="124" class="x">SGD.step()</text><text x="698" y="156" class="s">读取四组 .grad</text><text x="698" y="182" class="s">统一更新参数</text></svg>
