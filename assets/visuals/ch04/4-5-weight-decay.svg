<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">权重衰减的一步数值例子</title><desc id="d">相同任务梯度下，有权重衰减的参数比无衰减参数缩小更多。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}</style><text x="40" y="38" class="h">同样的任务梯度，正则项额外把大权重往零拉</text><rect x="40" y="78" width="400" height="130" class="b"/><text x="64" y="113" class="x">无权重衰减</text><text x="64" y="148" class="s">w=10，梯度=2，学习率=0.1</text><text x="64" y="180" class="x">新 w = 10 - 0.1×2 = 9.8</text><rect x="520" y="78" width="400" height="130" class="o"/><text x="544" y="113" class="x">λ=0.5</text><text x="544" y="148" class="s">总梯度 = 任务梯度 2 + λw 5</text><text x="544" y="180" class="x">新 w = 10 - 0.1×7 = 9.3</text><text x="40" y="243" class="x">正则不是把权重立刻清零，而是在每次更新中持续增加收缩力量。</text></svg>
