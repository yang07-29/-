<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">Inverted Dropout数值例子</title><desc id="d">激活全为2，丢弃概率一半，保留值放大到4，使期望仍为2。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">p=0.5：保留一半，同时把保留值除以 0.5</text><rect x="40" y="88" width="210" height="100" class="b"/><text x="62" y="126" class="x">输入 [2,2,2,2]</text><text x="62" y="160" class="s">平均值 2</text><line x1="250" y1="138" x2="330" y2="138" class="a"/><rect x="338" y="88" width="260" height="100" class="b"/><text x="360" y="126" class="x">一次 mask [1,0,1,0]</text><text x="360" y="160" class="s">丢掉第 2、4 项</text><line x1="598" y1="138" x2="678" y2="138" class="a"/><rect x="686" y="88" width="234" height="100" class="o"/><text x="708" y="126" class="x">输出 [4,0,4,0]</text><text x="708" y="160" class="s">这一次平均仍为 2</text><text x="40" y="228" class="x">eval 模式不采样 mask，直接输出原激活；不要手动再乘 0.5。</text></svg>
