<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">局部梯度连乘导致消失或爆炸</title><desc id="d">十层每层乘0.5得到约0.001，每层乘2得到1024。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.bad{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.good{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}</style><text x="40" y="38" class="h">十层连乘：每层只偏一点，最后可以差一百万倍</text><rect x="40" y="82" width="270" height="126" class="bad"/><text x="62" y="118" class="x">每层局部尺度 0.5</text><text x="62" y="154" class="x">0.5¹⁰ ≈ 0.001</text><text x="62" y="185" class="s">早期层几乎收不到信号</text><rect x="345" y="82" width="270" height="126" class="good"/><text x="367" y="118" class="x">每层局部尺度 1</text><text x="367" y="154" class="x">1¹⁰ = 1</text><text x="367" y="185" class="s">信号尺度保持</text><rect x="650" y="82" width="270" height="126" class="bad"/><text x="672" y="118" class="x">每层局部尺度 2</text><text x="672" y="154" class="x">2¹⁰ = 1024</text><text x="672" y="185" class="s">梯度可能爆炸</text><text x="40" y="244" class="x">合理初始化的目标是让典型信号不过快缩小或放大，不是保证每个梯度恒等于 1。</text></svg>
