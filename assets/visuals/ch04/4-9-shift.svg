<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">三类分布偏移对比</title><desc id="d">相机变化属于输入分布变，类别比例变化属于标签分布变，规则反转属于概念变。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.bad{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}</style><text x="40" y="38" class="h">先问“变的是输入、比例，还是判定规则”</text><rect x="40" y="78" width="270" height="134" class="b"/><text x="62" y="112" class="x">协变量偏移</text><text x="62" y="145" class="s">训练：室内明亮照片</text><text x="62" y="173" class="s">上线：夜间照片更多</text><text x="62" y="200" class="x">p(x) 变</text><rect x="345" y="78" width="270" height="134" class="b"/><text x="367" y="112" class="x">标签偏移</text><text x="367" y="145" class="s">训练：猫狗各一半</text><text x="367" y="173" class="s">上线：90% 是狗</text><text x="367" y="200" class="x">p(y) 变</text><rect x="650" y="78" width="270" height="134" class="bad"/><text x="672" y="112" class="x">概念偏移</text><text x="672" y="145" class="s">过去：规则 A 判欺诈</text><text x="672" y="173" class="s">现在：攻击方式改变</text><text x="672" y="200" class="x">p(y|x) 变</text><text x="40" y="246" class="x">只看到准确率下降还不能选补救方法，必须先判断哪种关系变了。</text></svg>
