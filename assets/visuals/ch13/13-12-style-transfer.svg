  <rect x="325" y="105" width="240" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280"/><text x="355" y="145" font-size="18" font-family="sans-serif">冻结特征提取器</text><text x="355" y="180" font-size="18" font-family="sans-serif">计算三类损失</text>
