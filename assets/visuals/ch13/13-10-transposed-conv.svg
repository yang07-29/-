<svg xmlns="http://www.w3.org/2000/svg" width="900" height="285" viewBox="0 0 900 285">
  <rect width="900" height="285" fill="#fff"/><text x="30" y="38" font-size="24" font-family="sans-serif">例：输入 2×2，k=2、stride=2、padding=0</text>
  <rect x="75" y="90" width="120" height="120" fill="#eef2ff" stroke="#6366f1"/><path d="M135 90V210M75 150H195" stroke="#6b7280"/><text x="100" y="245" font-size="18" font-family="sans-serif">H=2</text>
  <text x="230" y="160" font-size="28" font-family="sans-serif">→</text>
  <rect x="285" y="80" width="270" height="140" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="315" y="125" font-size="20" font-family="sans-serif">Hout=(2−1)×2+2</text><text x="390" y="170" font-size="28" font-family="sans-serif">=4</text>
  <text x="590" y="160" font-size="28" font-family="sans-serif">→</text>
  <rect x="650" y="70" width="160" height="160" fill="#ecfdf5" stroke="#10b981"/><path d="M690 70V230M730 70V230M770 70V230M650 110H810M650 150H810M650 190H810" stroke="#9ca3af"/>
  <text x="680" y="258" font-size="18" font-family="sans-serif">输出 4×4</text>
</svg>
