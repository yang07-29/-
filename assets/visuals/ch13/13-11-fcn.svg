<svg xmlns="http://www.w3.org/2000/svg" width="900" height="285" viewBox="0 0 900 285">
  <rect width="900" height="285" fill="#fff"/><text x="30" y="38" font-size="24" font-family="sans-serif">例：32×32 图像做 3 类分割</text>
  <rect x="45" y="90" width="180" height="110" rx="8" fill="#eef2ff" stroke="#6366f1"/><text x="70" y="130" font-size="18" font-family="sans-serif">输入 (B,3,32,32)</text><text x="80" y="165" font-size="16" font-family="sans-serif">下采样提语义</text>
  <text x="245" y="155" font-size="28" font-family="sans-serif">→</text>
  <rect x="295" y="90" width="220" height="110" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="320" y="130" font-size="18" font-family="sans-serif">1×1 分类器</text><text x="320" y="165" font-size="18" font-family="monospace">(B,3,8,8)</text>
  <text x="535" y="155" font-size="28" font-family="sans-serif">→</text>
  <rect x="585" y="90" width="270" height="110" rx="8" fill="#ecfdf5" stroke="#10b981"/><text x="610" y="130" font-size="18" font-family="sans-serif">转置卷积上采样 ×4</text><text x="635" y="165" font-size="18" font-family="monospace">(B,3,32,32)</text>
  <text x="45" y="250" font-size="16" font-family="sans-serif" fill="#4b5563">C=3 是类别分数通道；argmax 后才得到 (B,32,32) 类别图。</text>
</svg>
