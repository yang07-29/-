<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290">
  <rect width="900" height="290" fill="#fff"/><text x="30" y="38" font-size="24" font-family="sans-serif">例：两个 2×2 框错开 1 格</text>
  <rect x="80" y="75" width="180" height="180" fill="#f9fafb" stroke="#6b7280"/>
  <rect x="100" y="95" width="100" height="100" fill="#3b82f6" fill-opacity="0.35" stroke="#2563eb" stroke-width="3"/>
  <rect x="150" y="145" width="100" height="100" fill="#f59e0b" fill-opacity="0.35" stroke="#d97706" stroke-width="3"/>
  <rect x="150" y="145" width="50" height="50" fill="#10b981" fill-opacity="0.65"/>
  <text x="310" y="95" font-size="18" font-family="sans-serif">A 面积=4，B 面积=4</text><text x="310" y="135" font-size="18" font-family="sans-serif">交集=1，并集=4+4-1=7</text><text x="310" y="180" font-size="24" font-family="sans-serif">IoU = 1/7 ≈ 0.143</text>
  <text x="310" y="230" font-size="17" font-family="sans-serif" fill="#4b5563">匹配看 IoU；NMS 则在同类高分框之间按阈值抑制。</text>
</svg>
