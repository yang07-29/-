<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <rect width="900" height="250" fill="#fff"/><text x="30" y="38" font-size="24" font-family="sans-serif">例：横条类别做标签保持增广</text>
  <rect x="60" y="75" width="150" height="120" fill="#f3f4f6" stroke="#6b7280"/><rect x="75" y="120" width="120" height="25" fill="#3b82f6"/><text x="95" y="220" font-size="16" font-family="sans-serif">原图：横条</text>
  <text x="240" y="140" font-size="28" font-family="sans-serif">随机平移 →</text>
  <rect x="430" y="75" width="150" height="120" fill="#f3f4f6" stroke="#6b7280"/><rect x="445" y="98" width="120" height="25" fill="#3b82f6"/><text x="458" y="220" font-size="16" font-family="sans-serif">输出：仍是横条</text>
  <rect x="650" y="75" width="200" height="120" rx="8" fill="#ecfdf5" stroke="#10b981"/><text x="675" y="115" font-size="18" font-family="sans-serif">标签仍为 1</text><text x="675" y="150" font-size="16" font-family="sans-serif">位置变了，语义没变</text>
</svg>
