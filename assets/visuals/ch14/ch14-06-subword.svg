<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">两轮 BPE 合并</title><desc id="desc">low 与 lower 共享字符对，先合并 l o，再合并 lo w，得到共同子词 low。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">14.6 BPE：最高频相邻对，一轮只合一次规则</text>
  <rect x="45" y="88" width="250" height="210" rx="14" fill="#e0f2fe"/><text x="65" y="124" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">初始字符</text><text x="65" y="170" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">l o w &lt;/w&gt; ×5</text><text x="65" y="210" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">l o w e r &lt;/w&gt; ×2</text>
  <rect x="335" y="88" width="250" height="210" rx="14" fill="#ede9fe"/><text x="355" y="124" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">第 1 轮</text><text x="355" y="166" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">(l,o) 出现 7 次</text><text x="355" y="208" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">→ lo w ...</text><text x="355" y="248" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">合并频率最高对</text>
  <rect x="625" y="88" width="250" height="210" rx="14" fill="#dcfce7"/><text x="645" y="124" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">第 2 轮输出</text><text x="645" y="166" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">(lo,w) 出现 7 次</text><text x="645" y="208" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#166534">→ low + ...</text><text x="645" y="248" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">两词共享 low 子词</text>
  <path d="M295 193H327M585 193H617" stroke="#64748b" stroke-width="3"/><path d="M320 185l10 8-10 8M610 185l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
