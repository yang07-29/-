<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">BERT 掩蔽样本构造</title><desc id="desc">七个普通词选择一个位置，输入替换但标签保持原词，其余标签忽略。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">14.9 15% 先选位置，80/10/10 再改输入</text>
  <rect x="45" y="91" width="230" height="210" rx="14" fill="#e0f2fe"/><text x="65" y="127" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">候选位置</text><text x="65" y="172" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#0f172a">普通词元：7 个</text><text x="65" y="211" font-family="Arial,sans-serif" font-size="17" fill="#334155">round(7×15%)=1</text><text x="65" y="251" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">抽中 cats</text>
  <rect x="345" y="91" width="230" height="210" rx="14" fill="#ede9fe"/><text x="365" y="127" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">损坏输入</text><text x="365" y="171" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">80% → &lt;mask&gt;</text><text x="365" y="207" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#0f172a">10% → 随机词</text><text x="365" y="243" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#0f172a">10% → cats 不变</text>
  <rect x="645" y="91" width="230" height="210" rx="14" fill="#dcfce7"/><text x="665" y="127" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">标签始终一致</text><text x="665" y="174" font-family="Arial,sans-serif" font-size="19" fill="#0f172a">目标 = cats</text><text x="665" y="218" font-family="Arial,sans-serif" font-size="16" fill="#334155">其他位置 = -100</text><text x="665" y="256" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#334155">只算一个位置的损失</text>
  <path d="M275 196H337M575 196H637" stroke="#64748b" stroke-width="3"/><path d="M330 188l10 8-10 8M630 188l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
