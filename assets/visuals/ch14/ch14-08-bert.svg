<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">BERT 句对输入</title><desc id="desc">九个词元配片段零一和位置零到八，三种四维嵌入相加后输出一乘九乘四。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="46" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">14.8 同一位置叠加 token、segment、position</text>
  <text x="42" y="96" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#075985">token</text><text x="125" y="96" font-family="Arial,sans-serif" font-size="15" fill="#0f172a">&lt;cls&gt;  i  like  cats  &lt;sep&gt;  cats  are  cute  &lt;sep&gt;</text>
  <text x="42" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#5b21b6">segment</text><text x="125" y="145" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">0　0　0　 0　 0　　 1　 1　 1　 1</text>
  <text x="42" y="194" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">position</text><text x="125" y="194" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">0　1　2　 3　 4　　 5　 6　 7　 8</text>
  <rect x="108" y="230" width="250" height="64" rx="12" fill="#e0f2fe"/><rect x="380" y="230" width="170" height="64" rx="12" fill="#ede9fe"/><rect x="572" y="230" width="270" height="64" rx="12" fill="#dcfce7"/>
  <text x="137" y="270" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">3 × (1,9,4)</text><text x="430" y="270" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" fill="#0f172a">逐元素相加</text><text x="619" y="270" font-family="Arial,sans-serif" font-size="17" fill="#166534">Transformer → (1,9,4)</text>
