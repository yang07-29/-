<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">一个正例和四个负例</title><desc id="desc">负采样只计算五个点积，替代完整十万词 softmax。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">14.2 少做无意义的十万选一</text>
  <rect x="40" y="92" width="200" height="190" rx="14" fill="#e0f2fe"/><text x="60" y="128" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">中心词</text><text x="105" y="190" font-family="Arial,sans-serif" font-size="28" fill="#0f172a">cat</text><text x="65" y="238" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">词表 V=100000</text>
  <rect x="300" y="76" width="270" height="222" rx="14" fill="#ede9fe"/><text x="320" y="112" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">只核对 5 个候选</text><text x="320" y="150" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#166534">正：milk　标签 1</text><text x="320" y="184" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#991b1b">负：road / blue / run / desk</text><text x="320" y="232" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">每个候选只做一次 D 维点积</text>
  <rect x="630" y="92" width="250" height="190" rx="14" fill="#dcfce7"/><text x="650" y="128" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">计算量</text><text x="650" y="178" font-family="Arial,sans-serif" font-size="23" fill="#0f172a">100000 → 5</text><text x="650" y="220" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">目标改成噪声辨别</text>
  <path d="M240 190H292M570 190H622" stroke="#64748b" stroke-width="3"/><path d="M285 182l10 8-10 8M615 182l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
