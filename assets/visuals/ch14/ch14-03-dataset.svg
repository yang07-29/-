<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">从序列提取上下文</title><desc id="desc">深度作为中心词，窗口半径二，边界内得到三个上下文。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">14.3 边界处的窗口不会凭空补词</text>
  <rect x="52" y="105" width="150" height="74" rx="12" fill="#e2e8f0"/><rect x="212" y="105" width="150" height="74" rx="12" fill="#bfdbfe"/><rect x="372" y="105" width="150" height="74" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><rect x="532" y="105" width="150" height="74" rx="12" fill="#bfdbfe"/>
  <text x="111" y="151" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#0f172a">我</text><text x="258" y="151" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#0f172a">喜欢</text><text x="418" y="151" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="700" fill="#92400e">深度</text><text x="578" y="151" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" fill="#0f172a">学习</text>
  <path d="M447 190C447 230 130 213 130 245M447 190C447 225 287 218 287 245M447 190C447 225 607 218 607 245" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <text x="60" y="275" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">(深度, 我)</text><text x="220" y="275" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">(深度, 喜欢)</text><text x="540" y="275" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">(深度, 学习)</text><text x="710" y="148" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#334155">窗口=2</text><text x="710" y="180" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#334155">实际上下文=3</text>
