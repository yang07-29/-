<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">GloVe 单项损失</title><desc id="desc">共现一百次的对数目标约四点六零五，当前预测四点零，平方误差约零点三六六。</desc><rect width="920" height="360" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">14.5 手算一项 GloVe 损失</text>
  <rect x="45" y="91" width="230" height="200" rx="14" fill="#e0f2fe"/><text x="65" y="127" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">观察值</text><text x="65" y="177" font-family="Arial,sans-serif" font-size="20" fill="#0f172a">X(ice,cold)=100</text><text x="65" y="222" font-family="Arial,sans-serif" font-size="18" fill="#334155">log 100 ≈ 4.605</text>
  <rect x="345" y="91" width="230" height="200" rx="14" fill="#ede9fe"/><text x="365" y="127" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">模型当前预测</text><text x="365" y="177" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">v·u + b + c = 4.0</text><text x="365" y="222" font-family="Arial,sans-serif" font-size="18" fill="#334155">误差 = -0.605</text>
  <rect x="645" y="91" width="230" height="200" rx="14" fill="#dcfce7"/><text x="665" y="127" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">具体输出</text><text x="665" y="177" font-family="Arial,sans-serif" font-size="22" fill="#0f172a">(-0.605)²</text><text x="665" y="216" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#166534">≈ 0.366</text><text x="665" y="252" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" fill="#334155">假设权重 h=1</text>
  <path d="M275 191H337M575 191H637" stroke="#64748b" stroke-width="3"/><path d="M330 183l10 8-10 8M630 183l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
