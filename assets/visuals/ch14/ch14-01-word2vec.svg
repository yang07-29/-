<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">从窗口构造 Skip-Gram 样本</title><desc id="desc">句子 the cat likes milk 以 cat 为中心，产生两个正样本并计算一个二维点积。</desc>
  <rect width="920" height="360" rx="18" fill="#f8fafc"/><text x="36" y="48" font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">14.1 一个窗口怎样变成训练题</text>
  <rect x="36" y="84" width="250" height="210" rx="14" fill="#e0f2fe"/><text x="56" y="118" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#075985">小输入</text>
  <text x="56" y="158" font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#0f172a">the  [cat]  likes  milk</text><text x="56" y="192" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">中心：cat　窗口半径：1</text>
  <rect x="335" y="84" width="250" height="210" rx="14" fill="#ede9fe"/><text x="355" y="118" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#5b21b6">逐步过程</text>
  <text x="355" y="158" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">正对 1：(cat, the)</text><text x="355" y="190" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">正对 2：(cat, likes)</text><text x="355" y="230" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">(1,2)·(2,1)=4</text>
  <rect x="634" y="84" width="250" height="210" rx="14" fill="#dcfce7"/><text x="654" y="118" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">具体输出</text>
  <text x="654" y="158" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">2 条自监督样本</text><text x="654" y="194" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" fill="#0f172a">正例点积分数：4</text><text x="654" y="234" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#334155">窗口就是标签来源</text>
  <path d="M286 189H328M585 189H627" stroke="#64748b" stroke-width="3"/><path d="M321 181l10 8-10 8M620 181l10 8-10 8" fill="none" stroke="#64748b" stroke-width="3"/>
</svg>
