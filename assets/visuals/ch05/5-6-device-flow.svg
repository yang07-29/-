<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">模型批量标签与buffer设备一致</title><desc id="d">CPU批量迁移到统一目标设备，与模型和标签一起计算，预测再移回CPU。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.g{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.bad{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">设备不是模型的单独属性：同一次运算的所有张量必须对齐</text><rect x="40" y="82" width="210" height="122" class="b"/><text x="62" y="118" class="x">CPU DataLoader</text><text x="62" y="150" class="s">X:(2,10)</text><text x="62" y="178" class="s">y:(2,)</text><line x1="250" y1="143" x2="330" y2="143" class="a"/><text x="264" y="122" class="s">.to(device)</text><rect x="338" y="68" width="310" height="150" class="g"/><text x="360" y="104" class="x">统一 device</text><text x="360" y="136" class="s">model 参数 + buffer</text><text x="360" y="164" class="s">X + y + 新建常量</text><text x="360" y="194" class="x">logits: (2,3)</text><line x1="648" y1="143" x2="728" y2="143" class="a"/><rect x="736" y="82" width="184" height="122" class="b"/><text x="758" y="118" class="x">预测回 CPU</text><text x="758" y="150" class="s">pred.cpu()</text><text x="758" y="178" class="s">日志 / NumPy</text><text x="40" y="246" class="x">只迁模型、不迁 batch 会立刻报错；普通 Tensor 属性也不会随 model.to() 自动迁移。</text></svg>
