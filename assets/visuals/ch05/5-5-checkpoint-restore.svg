<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">完整checkpoint恢复训练</title><desc id="d">模型权重优化器速度训练进度和配置共同保存，恢复后固定输入输出一致并可继续一步。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">“能加载权重”只恢复模型；“无缝续训”还要恢复历史</text><rect x="40" y="70" width="260" height="150" class="b"/><text x="62" y="105" class="x">保存时</text><text x="62" y="136" class="s">模型 w=2</text><text x="62" y="164" class="s">优化器 velocity=0.5</text><text x="62" y="192" class="s">epoch=3，配置与随机状态</text><line x1="300" y1="145" x2="382" y2="145" class="a"/><rect x="390" y="84" width="190" height="122" class="b"/><text x="412" y="120" class="x">checkpoint.pt</text><text x="412" y="153" class="s">名字 → 状态</text><text x="412" y="181" class="s">不是模型源码</text><line x1="580" y1="145" x2="662" y2="145" class="a"/><rect x="670" y="70" width="250" height="150" class="o"/><text x="692" y="105" class="x">恢复验收</text><text x="692" y="136" class="s">固定 x=4：输出仍为 8</text><text x="692" y="164" class="s">velocity 仍为 0.5</text><text x="692" y="192" class="s">从 epoch 4 再训练一步</text><text x="40" y="246" class="x">若只加载 w=2，推理可一致，但下一次带动量更新通常不会一致。</text></svg>
