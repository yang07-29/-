<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">Module注册树与Shape</title><desc id="d">两个三维样本经过三到四和四到一的线性层，Module递归管理四组参数。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">Module 既组织数据流，也登记长期存在的参数</text><rect x="40" y="84" width="170" height="108" class="b"/><text x="62" y="122" class="x">X: (2,3)</text><text x="62" y="154" class="s">两个样本</text><line x1="210" y1="138" x2="276" y2="138" class="a"/><rect x="284" y="70" width="220" height="136" class="b"/><text x="306" y="106" class="x">Linear(3,4) → ReLU</text><text x="306" y="139" class="s">中间量 H: (2,4)</text><text x="306" y="171" class="s">weight、bias 已注册</text><line x1="504" y1="138" x2="570" y2="138" class="a"/><rect x="578" y="70" width="190" height="136" class="o"/><text x="600" y="106" class="x">Linear(4,1)</text><text x="600" y="139" class="s">Y: (2,1)</text><text x="600" y="171" class="s">共 21 个参数</text><rect x="800" y="70" width="120" height="136" class="b"/><text x="820" y="106" class="x">递归能力</text><text x="820" y="137" class="s">parameters</text><text x="820" y="163" class="s">to / eval</text><text x="820" y="189" class="s">state_dict</text><text x="40" y="238" class="x">层要在 __init__ 中绑定为属性或放入容器；forward 只描述这一批怎样流动。</text></svg>
