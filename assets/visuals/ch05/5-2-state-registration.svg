<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">参数buffer和普通属性对比</title><desc id="d">Parameter参与求导和优化，buffer保存迁移但不优化，普通张量默认不进入状态树。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.p{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.b{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.n{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}</style><text x="40" y="38" class="h">同样是张量，登记身份不同，训练系统的待遇就不同</text><rect x="40" y="74" width="270" height="142" class="p"/><text x="62" y="108" class="x">Parameter：w=2</text><text x="62" y="140" class="s">parameters ✓　state_dict ✓</text><text x="62" y="168" class="s">to(device) ✓　optimizer ✓</text><text x="62" y="198" class="x">反传可得 w.grad=12</text><rect x="345" y="74" width="270" height="142" class="b"/><text x="367" y="108" class="x">buffer：scale=3</text><text x="367" y="140" class="s">parameters ✗　state_dict ✓</text><text x="367" y="168" class="s">to(device) ✓　optimizer ✗</text><text x="367" y="198" class="x">保存但不训练</text><rect x="650" y="74" width="270" height="142" class="n"/><text x="672" y="108" class="x">普通张量：offset=1</text><text x="672" y="140" class="s">parameters ✗　state_dict ✗</text><text x="672" y="168" class="s">to(device) 默认 ✗</text><text x="672" y="198" class="x">需自行管理</text><text x="40" y="246" class="x">例：x=4 时 y=x×w×scale+offset=25；三份状态都参与前向，但生命周期完全不同。</text></svg>
