<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">逐样本中心化自定义层</title><desc id="d">两行输入分别减去自己的行均值，输出每行均值为零且Shape不变。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:18px}.s{font-size:15px;fill:#475569}.b{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">自定义层先用一个能手算的小张量核对数值、Shape 与广播轴</text><rect x="40" y="84" width="240" height="112" class="b"/><text x="62" y="121" class="x">X = [[1,3],</text><text x="108" y="151" class="x">[2,6]]</text><text x="62" y="181" class="s">Shape: (2,2)</text><line x1="280" y1="140" x2="350" y2="140" class="a"/><rect x="358" y="84" width="240" height="112" class="b"/><text x="380" y="121" class="x">行均值 [[2],</text><text x="466" y="151" class="x">[4]]</text><text x="380" y="181" class="s">keepdim → (2,1)</text><line x1="598" y1="140" x2="668" y2="140" class="a"/><rect x="676" y="84" width="244" height="112" class="o"/><text x="698" y="121" class="x">Y = [[-1,1],</text><text x="760" y="151" class="x">[-2,2]]</text><text x="698" y="181" class="s">每行均值为 0</text><text x="40" y="238" class="x">keepdim=True 保留行轴，(2,1) 才会按预期广播到 (2,2)。</text></svg>
