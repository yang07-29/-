<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="t d"><title id="t">LazyLinear首次前向实体化</title><desc id="d">LazyLinear四输出在看到二乘三输入后创建四乘三权重，之后输入宽度固定为三。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.x{font-size:17px}.s{font-size:15px;fill:#475569}.b{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:12}.o{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.bad{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><text x="40" y="38" class="h">Lazy 只把“第一次确定输入宽度”推迟，不会每批重建参数</text><rect x="40" y="82" width="220" height="122" class="b"/><text x="62" y="118" class="x">LazyLinear(4)</text><text x="62" y="150" class="s">in_features 未知</text><text x="62" y="180" class="s">weight 未实体化</text><line x1="260" y1="143" x2="330" y2="143" class="a"/><text x="270" y="122" class="s">X:(2,3)</text><rect x="338" y="82" width="250" height="122" class="o"/><text x="360" y="118" class="x">首次 forward 后</text><text x="360" y="150" class="s">weight: (4,3)</text><text x="360" y="180" class="s">output: (2,4)</text><line x1="588" y1="143" x2="658" y2="143" class="a"/><rect x="666" y="82" width="254" height="122" class="bad"/><text x="688" y="118" class="x">之后输入 X:(2,5)</text><text x="688" y="150" class="s">最后一维与 3 不符</text><text x="688" y="180" class="x">报矩阵维度错误</text><text x="40" y="242" class="x">dry run → 核对 Shape → 初始化 → 建优化器，是最清楚的生命周期。</text></svg>
